<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>FORMULARIOS HTML</title>
</head>
<body>
     <a href="index.html">← Regresar a la página principal</a>
    <center>
        <h1>FORMULARIOS HTML</h1>
        <h3><a href="index.html">REGRESAR</a></h3>
        <table width="100%" border align="center">
            <thead>
                <tr align="center">
                    <td><h3>NP</h3></td>
                    <td><h3>Nombre</h3></td>
                    <td><h3>Ejemplo</h3></td>
                    <td><h3>Descripcion</h3></td>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><h3>1</h3></td>
                    <td>optgroup</td>
                    <td>
                        <label for="">Carrera</label>
                        <select name="carrera" id="">
                            <optgroup label="Economico-Administrativas">
                                <option value="">Contabilidad</option>
                                <option value="">Administracion</option>
                            </optgroup>
                            <optgroup label="Tecnologicas">
                                <option value="">Programacion</option>
                                <option value="">Mantenimiento</option>
                            </optgroup>
                        </select>
                    </td>
                    <td>
                        Etiqueta que sirve para agrupar opciones dentro de una lista desplegable
                    </td>
                </tr>
                <tr>
                    <td><h3>2</h3></td>
                    <td>meter</td>
                    <td>
                        <meter min="0" max="10" low="5" high="8" value="6.0" optimum="10" title="6.0 de 10"></meter>
                    </td>
                    <td>Muestra graficamente un valor predeterminado</td>
                </tr>
            </tbody>
        </table>
    </center>
</body>
</html>
